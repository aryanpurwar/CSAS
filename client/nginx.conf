server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: unknown routes serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API and campaign-click routes to the server container.
  location /api/ { proxy_pass http://api:5000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /c/   { proxy_pass http://api:5000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

  location ~* \.(js|css|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
